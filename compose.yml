name: sleid

# Local dev services. Host port 5433 avoids clashing with untumu's Postgres on 5432.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sleid
      POSTGRES_USER: sleid
      POSTGRES_PASSWORD: sleid
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5433:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sleid -d sleid]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional web search for the wizard's research step. Start with: docker compose --profile research up -d searxng
  # Then set SEARXNG_URL=http://127.0.0.1:8888 in .env. Bound to localhost only.
  searxng:
    image: searxng/searxng:latest
    profiles: [research]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-local-only}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - 127.0.0.1:8888:8080

  # M2 note: the collab service (apps/collab, Hocuspocus, WebSocket port 3001) has no container image yet.
  # It runs with `pnpm dev` next to web. A Dockerfile needs COLLAB_HOST=0.0.0.0 and the two secrets.
  # TODO(M3): worker service (pg-boss jobs: export, import, wizard).
  # TODO: app service (production build of apps/web) once deployment is planned.

volumes:
  pgdata:
